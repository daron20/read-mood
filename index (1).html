<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무드 리더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Apple 색·타이포 토큰 ───────────────────────────────── */
:root{
  --bg:#f5f5f7; --surface:#fff; --pearl:#fafafc;
  --ink:#1d1d1f; --ink-2:#333; --ink-3:#7a7a7a;
  --hair:#e0e0e0; --divider:#f0f0f0;
  --accent:#0066cc; --focus:#0071e3; --accent-soft:#e8f1fc;
  --bar:rgba(255,255,255,.88); --bar-2:rgba(255,255,255,.95); --sheet:#fff;
  --sh-1:0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 2px 6px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.07);
  --sh-bar:0 1px 0 rgba(0,0,0,.06);
  --field:#fafafc; --on-ink:#fff;
  --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
}
:root[data-theme=sepia]{
  --bg:#f2ece1; --surface:#fbf7ee; --pearl:#f6f1e6;
  --ink:#332c22; --ink-2:#4a4133; --ink-3:#8b8071;
  --hair:#e2d9c8; --divider:#ece4d6; --accent:#8a6534; --accent-soft:#efe5d4;
  --bar:rgba(251,247,238,.9); --bar-2:rgba(251,247,238,.96); --sheet:#fbf7ee;
  --field:#f6f1e6; --on-ink:#fbf7ee;
}
:root[data-theme=dark]{
  --bg:#000; --surface:#1d1d1f; --pearl:#252527;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#86868b;
  --hair:#424245; --divider:#2a2a2c;
  --accent:#2997ff; --focus:#2997ff; --accent-soft:#12283d;
  --bar:rgba(0,0,0,.86); --bar-2:rgba(0,0,0,.95); --sheet:#1d1d1f;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
  --sh-bar:0 1px 0 rgba(255,255,255,.08);
  --field:#2a2a2c; --on-ink:#000;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--bar:#fff;--bar-2:#fff} :root[data-theme=sepia]{--bar:#fbf7ee;--bar-2:#fbf7ee} :root[data-theme=dark]{--bar:#000;--bar-2:#000}
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.47;letter-spacing:-.374px;
  -webkit-font-smoothing:antialiased;
}
body.ready{transition:background .25s,color .25s}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font-family:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.search input:focus-visible{outline-offset:0}
[data-view=library] #reader,[data-view=reader] #library{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 상단 앱바 (구글식 구조) ─────────────────────────────── */
.appbar{position:sticky;top:0;z-index:30;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:var(--sh-bar)}
.bar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:17px;padding:0 24px}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:600;letter-spacing:.231px;
  color:var(--ink);white-space:nowrap;cursor:pointer}
.brand:hover{text-decoration:none;opacity:.7}
.brand .mk{font-size:19px}

/* 검색 (Material 3 search bar 형태 · Apple 색) */
.search{flex:1;max-width:560px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:16px;width:18px;height:18px;fill:var(--ink-3);pointer-events:none}
.search input{width:100%;height:48px;border-radius:var(--r-pill);border:1px solid transparent;
  background:var(--field);padding:0 44px 0 46px;font-size:15px;letter-spacing:-.2px;outline:none;
  transition:background .18s,box-shadow .18s,border-color .18s}
.search input::placeholder{color:var(--ink-3)}
.search input:hover{background:var(--surface);box-shadow:var(--sh-1)}
.search input:focus{background:var(--surface);border-color:var(--hair);box-shadow:0 0 0 4px var(--accent-soft),var(--sh-1)}
.search .clr{position:absolute;right:8px;width:32px;height:32px;border:0;background:transparent;
  border-radius:var(--r-pill);color:var(--ink-3);font-size:15px;cursor:pointer;display:none}
.search .clr:hover{background:var(--divider);color:var(--ink)}
.search.has .clr{display:block}

.bar-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon{width:38px;height:38px;border-radius:var(--r-pill);border:0;background:transparent;
  color:var(--ink-2);font-size:15px;cursor:pointer;transition:background .15s}
.icon:hover{background:var(--divider)}

/* ── 필터 칩 줄 ─────────────────────────────────────────── */
.chipbar{border-top:1px solid var(--divider);background:var(--bar);position:relative}
.chipbar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:48px;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--bg))}
@media (min-width:1230px){.chipbar::after{display:none}}
.chip-in{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:8px;
  overflow-x:auto;scrollbar-width:none}
.chip-in::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--hair);
  background:var(--surface);color:var(--ink-2);font-size:14px;letter-spacing:-.224px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.chip:hover{background:var(--pearl);border-color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}
.chip-sep{flex:none;width:1px;height:22px;background:var(--hair);margin:0 4px}

/* ── 본문 ───────────────────────────────────────────────── */
main{max-width:1180px;margin:0 auto;padding:24px 24px 80px}
.resline{font-size:14px;color:var(--ink-3);letter-spacing:-.224px;padding:4px 2px 17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:17px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;cursor:pointer;
  box-shadow:var(--sh-1);border:1px solid transparent;
  transition:transform .2s cubic-bezier(.25,.1,.25,1),box-shadow .2s,border-color .2s;
  display:flex;flex-direction:column;gap:12px;min-height:150px}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--hair)}
.card .idx{font-size:12px;color:var(--ink-3);letter-spacing:-.12px}
.card .ti{font-size:19px;font-weight:600;line-height:1.24;letter-spacing:-.374px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.card .au{font-size:14px;color:var(--ink-3);letter-spacing:-.224px;margin-top:-6px}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12px;color:var(--ink-3);letter-spacing:-.12px}
.card .dom{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ink-2)}
.card .dom .sw{width:8px;height:8px;border-radius:50%}
.empty{grid-column:1/-1;text-align:center;padding:72px 24px;color:var(--ink-3);font-size:17px}
.empty b{display:block;color:var(--ink);font-size:21px;font-weight:600;margin-bottom:8px}

/* 번호 페이저 (구글식) */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;padding:48px 0 8px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;padding:0 10px;border-radius:var(--r-pill);border:0;
  background:transparent;color:var(--accent);font-size:15px;cursor:pointer;transition:.15s}
.pager button:hover:not(:disabled){background:var(--divider)}
.pager button.on{background:var(--ink);color:var(--on-ink);font-weight:600}
.pager button:disabled{color:var(--ink-3);opacity:.45;cursor:default}
.foot-note{text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:-.12px;line-height:1.9;
  padding:32px 24px 0;border-top:1px solid var(--divider);margin-top:32px}

/* ── 독서 화면 ──────────────────────────────────────────── */
.rbar .bar-in{gap:12px}
.rbar .bk{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--ink-3);letter-spacing:-.224px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{height:36px;padding:0 14px 0 10px;border-radius:var(--r-pill);border:1px solid var(--hair);
  background:var(--surface);font-size:14px;color:var(--ink-2);cursor:pointer;transition:.15s;white-space:nowrap}
.back:hover{background:var(--pearl)}
.strip{display:flex;height:4px;background:var(--divider);cursor:pointer}
.strip i{flex:1;opacity:.5;transition:opacity .15s,transform .15s}
.strip i:hover{opacity:.9}
.strip i.cur{opacity:1;transform:scaleY(2.2)}
.reading{max-width:760px;margin:0 auto;padding:32px 24px 168px}
.sheet{position:relative;background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:56px 64px 72px;min-height:540px}
#text{font-family:"Noto Serif KR",ui-serif,Georgia,serif;font-size:19px;line-height:2.0;
  letter-spacing:-.2px;text-align:left;word-break:keep-all;transition:opacity .2s}
#text.turning{opacity:0}
#text p{margin:0 0 1.2em;text-indent:1em}
#text p:first-child{text-indent:0}
.folio{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:12px;color:var(--ink-3);
  letter-spacing:.16em;font-variant-numeric:tabular-nums}
.tap{position:absolute;top:0;bottom:0;width:22%;cursor:pointer;opacity:0;transition:opacity .2s;
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-3)}
.tap:hover{opacity:.5}
.tap.L{left:0}.tap.R{right:0}.tap.off{display:none}
.note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:20px 4px 0;font-size:14px;
  color:var(--ink-3);letter-spacing:-.224px}
.badge{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--hair);color:var(--ink-2);font-weight:500}
.badge .sw{width:9px;height:9px;border-radius:50%}

/* 하단 플레이어 바 */
.playbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar-2);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--divider)}
.play-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 24px calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
.pbtn{width:40px;height:40px;flex:none;border-radius:var(--r-pill);border:0;background:var(--ink);
  color:var(--on-ink);font-size:14px;cursor:pointer;transition:.15s}
.pbtn:hover{opacity:.82}
.now{flex:1;min-width:150px;font-size:14px;color:var(--ink-3);letter-spacing:-.224px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{font-weight:500;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:var(--r-pill);
  background:var(--hair);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
.seg{display:inline-flex;background:var(--divider);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-3);font-size:13px;letter-spacing:-.2px;
  padding:5px 11px;border-radius:6px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);font-weight:500}
.sw-lab{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);cursor:pointer}
.sw-lab input{accent-color:var(--focus);width:15px;height:15px}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);background:#1d1d1f;
  color:#fff;padding:11px 18px;border-radius:var(--r-md);font-size:14px;opacity:0;transition:.3s;
  pointer-events:none;z-index:50;max-width:88vw;box-shadow:var(--sh-2)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:96px 24px;color:var(--ink-3);font-size:15px}

@media (max-width:760px){
  .bar-in{height:56px;padding:0 16px;gap:10px}
  .brand span.nm{display:none}
  .chip-in{padding:9px 16px}
  main{padding:17px 16px 72px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{min-height:0;padding:16px;gap:8px}
  .card .ti{font-size:17px}
  .card .au{margin-top:-4px}
  .reading{padding:20px 12px 176px}
  .sheet{padding:32px 24px 60px;min-height:0;border-radius:var(--r-md)}
  #text{font-size:18px;line-height:1.95}
  .play-in{padding:10px 16px;gap:10px}
  .now{min-width:0;flex:1 1 100%;order:9;font-size:13px}
  .play-in input[type=range]{display:none}
  .seg button{padding:5px 9px;font-size:12px}
}
</style>
</head>
<body>
<div id="app" data-view="library">

<!-- ═══ 서재 ═══ -->
<section id="library">
  <header class="appbar">
    <div class="bar-in">
      <div class="brand" id="brand"><span class="mk">◖</span><span class="nm">무드 리더</span></div>
      <div class="search" id="searchwrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="q" placeholder="작품 · 작가 검색" autocomplete="off">
        <button class="clr" id="q-clr" title="지우기">✕</button>
      </div>
      <div class="bar-act">
        <button class="icon" id="btn-theme" title="화면 모드">◐</button>
      </div>
    </div>
    <div class="chipbar"><div class="chip-in" id="chips"></div></div>
  </header>
  <main>
    <div class="resline" id="count"></div>
    <div class="grid" id="shelf"><div class="loading">서재를 불러오는 중…</div></div>
    <nav class="pager" id="pager"></nav>
    <div class="foot-note" id="credit"></div>
  </main>
</section>

<!-- ═══ 독서 ═══ -->
<section id="reader">
  <header class="appbar rbar">
    <div class="bar-in">
      <button class="back" id="btn-back">‹ 서재</button>
      <span class="bk" id="bk"></span>
      <div class="bar-act">
        <button class="icon" id="fs-down" title="글자 작게">A－</button>
        <button class="icon" id="fs-up" title="글자 크게">A＋</button>
        <button class="icon" id="btn-theme2" title="화면 모드">◐</button>
      </div>
    </div>
    <div class="strip" id="strip" title="작품 전체의 무드 흐름"></div>
  </header>
  <main class="reading">
    <div class="sheet">
      <div class="tap L" id="tap-prev">‹</div>
      <div class="tap R" id="tap-next">›</div>
      <div id="text"></div>
      <div class="folio" id="folio"></div>
    </div>
    <div class="note">
      <span class="badge"><span class="sw" id="mood-dot"></span><span id="mood-name">—</span></span>
      <span id="why"></span>
    </div>
  </main>
  <div class="playbar">
    <div class="play-in">
      <button class="pbtn" id="btn-play">▶</button>
      <span class="now" id="now">♪</span>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" title="볼륨">
      <span class="seg" id="sens">
        <button data-v="0.15">둔하게</button><button data-v="0.08" class="on">보통</button><button data-v="0.03">민감</button>
      </span>
      <label class="sw-lab"><input type="checkbox" id="music-on" checked>음악</label>
    </div>
  </div>
</section>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app = $('#app');
  requestAnimationFrame(() => document.body.classList.add('ready'));  // 첫 페인트 후에만 테마 전환 애니메이션
  let toastT;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3400); };

  let CAT = null, MOODS = {}, TRACKS = {}, POOLS = {};
  const color = g => 'hsl(' + ((MOODS[g] || {}).hue ?? 40) + ' 58% 56%)';
  const hash = s => { let x = 2166136261; for (const c of s) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
  const dominant = seq => { const c = {}; seq.forEach(g => c[g] = (c[g] || 0) + 1);
    return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b))[0]; };

  /* 무드 → 곡 배정 (노트북 규칙과 동일, 브라우저에서 계산) */
  function choose(scores, cur, margin) {
    let best = null;
    for (const g in scores) if (best === null || scores[g] > scores[best]) best = g;
    if (cur && cur in scores && scores[best] - scores[cur] < margin) return cur;
    return best;
  }
  function makePlan(book, margin) {
    const out = []; let prevG = null, prevT = null, last = -10;
    book.pages.forEach((p, i) => {
      const g = choose(p.s, prevG, margin * (i - last <= 1 ? 2 : 1));
      let t = prevT; const changed = g !== prevG;
      if (changed) {
        const pool = POOLS[g] || [];
        const cand = pool.filter(x => x !== prevT);
        const list = cand.length ? cand : (pool.length ? pool : Object.keys(TRACKS));
        t = list.length ? list[hash(book.sn + ':' + i) % list.length] : null;
        last = i;
      }
      out.push({ g, t, changed }); prevG = g; prevT = t;
    });
    return out;
  }

  /* ── 테마 ── */
  const THEMES = ['light', 'sepia', 'dark'];
  const cycleTheme = () => { const r = document.documentElement;
    r.dataset.theme = THEMES[(THEMES.indexOf(r.dataset.theme) + 1) % THEMES.length]; };
  $('#btn-theme').onclick = cycleTheme; $('#btn-theme2').onclick = cycleTheme;

  /* ── 서재 ── */
  let sort = 'title', moodF = '', query = '', libPage = 1, randomOrder = null;
  const PER = 12;

  function buildChips() {
    const sorts = [['title', '제목순'], ['author', '작가순'], ['random', '랜덤']];
    let h = sorts.map(([k, n]) => '<button class="chip' + (sort === k ? ' on' : '') + '" data-sort="' + k + '">' + n + '</button>').join('');
    h += '<span class="chip-sep"></span>';
    h += '<button class="chip' + (moodF === '' ? ' on' : '') + '" data-mood="">전체 무드</button>';
    for (const g in MOODS) h += '<button class="chip' + (moodF === g ? ' on' : '') + '" data-mood="' + g + '">' +
      '<span class="sw" style="background:' + color(g) + '"></span>' + esc(MOODS[g].name) + '</button>';
    $('#chips').innerHTML = h;
    $('#chips').querySelectorAll('[data-sort]').forEach(b => b.onclick = () => {
      sort = b.dataset.sort; if (sort === 'random') randomOrder = null;   // 랜덤은 누를 때만 재셔플
      libPage = 1; buildChips(); renderLib();
    });
    $('#chips').querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
      moodF = b.dataset.mood; libPage = 1; buildChips(); renderLib();
    });
  }

  function sorted() {
    const base = CAT.books.slice();
    if (sort === 'author') return base.sort((a, b) => (a.author + a.title).localeCompare(b.author + b.title, 'ko'));
    if (sort === 'random') return (randomOrder || (randomOrder = base.sort(() => Math.random() - .5))).slice();
    return base.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  }

  function pagerHTML(cur, total) {
    if (total <= 1) return '';
    let h = '<button data-p="' + (cur - 1) + '"' + (cur <= 1 ? ' disabled' : '') + '>‹</button>';
    let s = Math.max(1, cur - 3), e = Math.min(total, s + 6); s = Math.max(1, e - 6);
    if (s > 1) h += '<button data-p="1">1</button>' + (s > 2 ? '<button disabled>…</button>' : '');
    for (let i = s; i <= e; i++) h += '<button class="' + (i === cur ? 'on' : '') + '" data-p="' + i + '">' + i + '</button>';
    if (e < total) h += (e < total - 1 ? '<button disabled>…</button>' : '') + '<button data-p="' + total + '">' + total + '</button>';
    h += '<button data-p="' + (cur + 1) + '"' + (cur >= total ? ' disabled' : '') + '>›</button>';
    return h;
  }

  function renderLib() {
    const q = query.toLowerCase();
    const items = sorted().filter(b =>
      (!moodF || dominant(b.seq) === moodF) &&
      (!q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)
         || b.tags.some(t => t.toLowerCase().includes(q))));
    const pages = Math.max(1, Math.ceil(items.length / PER));
    libPage = Math.min(Math.max(1, libPage), pages);
    $('#count').textContent = '작품 약 ' + items.length + '편' +
      (query ? ' · 검색 “' + query + '”' : '') + (moodF ? ' · ' + MOODS[moodF].name : '');
    const slice = items.slice((libPage - 1) * PER, libPage * PER);
    $('#shelf').innerHTML = slice.length ? slice.map((b, i) => {
      const d = dominant(b.seq), m = MOODS[d] || { name: '?', emoji: '' };
      return '<article class="card" data-sn="' + esc(b.sn) + '">' +
        '<div class="idx">' + ((libPage - 1) * PER + i + 1) + '</div>' +
        '<h3 class="ti">' + esc(b.title) + '</h3>' +
        '<div class="au">' + esc(b.author || '작가 미상') + '</div>' +
        '<div class="foot"><span class="dom"><span class="sw" style="background:' + color(d) + '"></span>' +
          esc(m.emoji + ' ' + m.name) + '</span><span>·</span><span>' + b.pages + '쪽</span></div>' +
      '</article>';
    }).join('') : '<div class="empty"><b>결과가 없습니다</b>다른 검색어나 무드를 골라 보세요.</div>';
    $('#shelf').querySelectorAll('.card').forEach(el => el.onclick = () => openBook(el.dataset.sn));
    $('#pager').innerHTML = pagerHTML(libPage, pages);
    $('#pager').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      libPage = +b.dataset.p; renderLib(); scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  let qT;
  $('#q').oninput = e => {
    $('#searchwrap').classList.toggle('has', !!e.target.value);
    clearTimeout(qT); qT = setTimeout(() => { query = e.target.value.trim(); libPage = 1; renderLib(); }, 200);
  };
  $('#q-clr').onclick = () => { $('#q').value = ''; $('#searchwrap').classList.remove('has');
    query = ''; libPage = 1; renderLib(); $('#q').focus(); };
  $('#brand').onclick = () => { query = ''; moodF = ''; libPage = 1; $('#q').value = '';
    $('#searchwrap').classList.remove('has'); buildChips(); renderLib(); scrollTo({ top: 0, behavior: 'smooth' }); };

  /* ── 음악: 두 플레이어 크로스페이드 ── */
  const players = [new Audio(), new Audio()];
  players.forEach(a => { a.loop = true; a.preload = 'auto'; a._tok = 0; });
  let active = 0, curTrack = null, vol = .5, musicOn = true;
  function fade(a, to, ms) {
    const tok = ++a._tok, from = a.volume, t0 = performance.now();
    return new Promise(res => { const step = () => {
        if (a._tok !== tok) return res(false);
        const k = Math.min(1, (performance.now() - t0) / ms);
        a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
        k < 1 ? requestAnimationFrame(step) : res(true);
      }; step(); });
  }
  function nowLabel() {
    const t = TRACKS[curTrack];
    if (!t) { $('#now').textContent = '♪ 음악 없음'; return; }
    $('#now').innerHTML = '♪ <b>' + esc(t.title) + '</b>' + (t.artist ? ' — ' + esc(t.artist) : '') +
      ' <a href="' + esc(t.url) + '" target="_blank" rel="noopener" title="' + esc(t.license || '공유마당') + '">↗</a>';
  }
  async function playActive() {
    const a = players[active];
    try {
      await a.play();
      if (!musicOn || a !== players[active]) { a.pause(); return; }   // 로딩 중 페이지가 더 넘어갔거나 음악을 껐다
      if (a.paused) return;
      $('#btn-play').textContent = '❚❚'; fade(a, vol, 1200);
    } catch (e) {
      if (a !== players[active]) return;
      $('#btn-play').textContent = '▶'; toast('브라우저가 자동재생을 막았어요. ▶ 버튼을 눌러 주세요.');
    }
  }
  function setTrack(id) {
    if (id === curTrack) return;
    curTrack = id; nowLabel();
    const old = players[active];
    old._tok++;                                                        // 이전 페이드 취소
    if (!old.paused) fade(old, 0, 900).then(ok => { if (ok && old !== players[active]) old.pause(); });
    active ^= 1;
    const nu = players[active];
    nu._tok++; nu.pause();                                             // 남은 페이드가 새 곡을 멈추지 못하게
    if (!id || !TRACKS[id]) { nu.removeAttribute('src'); return; }
    nu.src = TRACKS[id].file; nu.volume = 0;
    if (musicOn) playActive();
  }
  function stopMusic(ms = 500) {
    players.forEach(a => { if (!a.paused) fade(a, 0, ms).then(ok => { if (ok) a.pause(); }); });
    $('#btn-play').textContent = '▶';
  }
  $('#btn-play').onclick = () => {
    const a = players[active];
    if (!a.src) return toast('아직 재생할 곡이 없어요');
    if (a.paused) { if (!musicOn) { musicOn = true; $('#music-on').checked = true; } a.volume = 0; playActive(); }
    else stopMusic(300);
  };
  $('#vol').oninput = e => { vol = +e.target.value; const a = players[active]; a._tok++; if (!a.paused) a.volume = vol; };
  $('#music-on').onchange = e => { musicOn = e.target.checked;
    if (musicOn && players[active].src) { players[active].volume = 0; playActive(); } else stopMusic(); };

  /* ── 독서 ── */
  const cache = {};
  let book = null, plan = [], idx = 0, fontSize = 19, margin = .08;
  $('#fs-up').onclick = () => { fontSize = Math.min(26, fontSize + 1); $('#text').style.fontSize = fontSize + 'px'; };
  $('#fs-down').onclick = () => { fontSize = Math.max(15, fontSize - 1); $('#text').style.fontSize = fontSize + 'px'; };
  $('#sens').querySelectorAll('button').forEach(b => b.onclick = () => {
    $('#sens').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    margin = +b.dataset.v;
    if (book) { plan = makePlan(book, margin); drawStrip(); show(idx, false); }
  });

  function drawStrip() {
    $('#strip').innerHTML = plan.map((p, i) => '<i data-i="' + i + '" style="background:' + color(p.g) +
      '" title="' + (i + 1) + '쪽 · ' + esc((MOODS[p.g] || {}).name) + '"></i>').join('');
    $('#strip').querySelectorAll('i').forEach(el => el.onclick = () => show(+el.dataset.i));
  }

  function show(n, animate = true) {
    if (!book) return;
    n = Math.max(0, Math.min(book.pages.length - 1, n));
    const p = book.pages[n], pl = plan[n], m = MOODS[pl.g] || { name: '?', emoji: '' };
    const paint = () => {
      idx = n;
      $('#text').innerHTML = p.text.split(/\n\n+/).map(x => '<p>' + esc(x) + '</p>').join('');
      $('#folio').textContent = n + 1 + ' / ' + book.pages.length;
      $('#mood-dot').style.background = color(pl.g);
      $('#mood-name').textContent = m.emoji + ' ' + m.name + (!pl.changed && n > 0 ? ' · 유지' : '');
      $('#why').textContent = p.top.length ? '감정 ' + p.top.map(([l, s]) => l + ' ' + Math.round(s * 100) + '%').join(' · ') : '';
      $('#tap-prev').classList.toggle('off', n <= 0);
      $('#tap-next').classList.toggle('off', n >= book.pages.length - 1);
      $('#strip').querySelectorAll('i').forEach((el, i) => el.classList.toggle('cur', i === n));
      $('#text').classList.remove('turning');
      try { history.replaceState(null, '', '#' + book.sn + '/' + (n + 1)); } catch (e) {}
      setTrack(pl.t);
    };
    if (animate && n !== idx) { $('#text').classList.add('turning'); setTimeout(paint, 180); } else paint();
  }

  async function openBook(sn, page = 1) {
    try {
      app.dataset.view = 'reader'; scrollTo(0, 0);
      $('#text').innerHTML = '<div class="loading">책을 여는 중…</div>'; $('#bk').textContent = ''; $('#strip').innerHTML = '';
      if (!cache[sn]) {
        const r = await fetch('data/books/' + encodeURIComponent(sn) + '.json');
        if (!r.ok) throw new Error('작품 데이터를 찾을 수 없어요 (' + r.status + ')');
        cache[sn] = await r.json();
      }
      book = cache[sn]; plan = makePlan(book, margin); idx = -1;
      $('#bk').innerHTML = '<b>' + esc(book.title) + '</b> · ' + esc(book.author || '작가 미상') +
        ' <a href="' + esc(book.url) + '" target="_blank" rel="noopener" title="' + esc(book.license || '공유마당') + '">↗</a>';
      drawStrip(); show(page - 1, false);
    } catch (e) { toast(e.message); backToLib(); }
  }
  function backToLib() {
    app.dataset.view = 'library'; book = null; curTrack = null; stopMusic(400);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  $('#btn-back').onclick = backToLib;
  $('#tap-next').onclick = () => show(idx + 1);
  $('#tap-prev').onclick = () => show(idx - 1);
  document.addEventListener('keydown', e => {
    if (app.dataset.view !== 'reader' || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
    if (e.key === 'Escape') backToLib();
  });
  let tx = null;
  $('.sheet').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('.sheet').addEventListener('touchend', e => {
    if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  });

  /* ── 시작 ── */
  (async () => {
    try {
      const r = await fetch('data/books.json');
      if (!r.ok) throw new Error('data/books.json 을 불러오지 못했어요 (' + r.status + ')');
      CAT = await r.json();
      MOODS = CAT.moods; TRACKS = CAT.tracks; margin = CAT.switch_margin ?? .08;
      for (const [id, t] of Object.entries(TRACKS)) (POOLS[t.g] ||= []).push(id);
      for (const g in POOLS) POOLS[g].sort();
      $('#sens').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === margin));
      $('#credit').innerHTML = '작품 · 음원 <a href="https://gongu.copyright.or.kr" target="_blank" rel="noopener">공유마당</a>' +
        ' — 각 항목의 ↗ 에 원본 출처와 이용 조건 표시<br>감정 분석 ' +
        '<a href="https://huggingface.co/' + esc(CAT.model) + '" target="_blank" rel="noopener">KOTE</a> (' + esc(CAT.engine) + ')';
      buildChips(); renderLib();
      const m = location.hash.match(/^#([^/]+)\/(\d+)$/);
      if (m && CAT.books.some(b => b.sn === m[1])) openBook(m[1], +m[2]);
    } catch (e) {
      $('#shelf').innerHTML = '<div class="empty"><b>' + esc(e.message) + '</b>' +
        'HTML 파일을 더블클릭해서 열면 동작하지 않습니다. GitHub Pages에 올리거나, ' +
        '폴더에서 <code>python -m http.server</code> 실행 후 http://localhost:8000 으로 여세요.</div>';
      $('#count').textContent = '';
    }
  })();
})();
</script>
</body>
</html>
